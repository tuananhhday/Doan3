function chart(kind){const W=1120,H=440,L=85,R=30,T=28,B=70;let out='';const colors=['#2563eb','#0d9488','#d97706'];const models=['GRU4Rec','NARM','SASRec'];let vals=kind==='budget'?DATA.analysis.curves.map(r=>r['Best_valid_MRR@20']):DATA.analysis.comparison.map(r=>r['MRR@20']);let hi=Math.max(.05,...vals)*1.18;const y=v=>H-B-v/hi*(H-T-B);for(let i=0;i<=4;i++){const v=hi*i/4;out+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#dce2e8"/><text x="${L-10}" y="${y(v)+6}" text-anchor="end">${v.toFixed(3)}</text>`}if(kind==='budget'){const x=k=>L+(k-1)/11*(W-L-R);models.forEach((m,j)=>{let a=DATA.analysis.curves.filter(r=>r.Model===m);out+=`<polyline fill="none" stroke="${colors[j]}" stroke-width="4" points="${a.map(r=>x(r.K)+','+y(r['Best_valid_MRR@20'])).join(' ')}"/>`;a.forEach(r=>out+=`<circle cx="${x(r.K)}" cy="${y(r['Best_valid_MRR@20'])}" r="5" fill="${colors[j]}"/>`);if(a.length)out+=`<line x1="${L}" y1="${y(a[0]['Default_valid_MRR@20'])}" x2="${W-R}" y2="${y(a[0]['Default_valid_MRR@20'])}" stroke="${colors[j]}" stroke-dasharray="7,6"/>`;out+=`<text x="${L+j*250}" y="${H-8}" fill="${colors[j]}">${m}</text>`});[1,3,6,12].forEach(k=>out+=`<text x="${x(k)}" y="${H-B+30}" text-anchor="middle">${k}</text>`)}else{let groups=['All-seen','Warm','Long-tail'];groups.forEach((g,gi)=>{let gx=L+gi*(W-L-R)/3;models.forEach((m,mi)=>{let xx=gx+mi*90+12;['Default','Tuned'].forEach((v,vi)=>{let r=DATA.analysis.comparison.find(r=>r.Group===g&&r.Model===m&&r.Variant===v);if(r)out+=`<rect x="${xx+vi*29}" y="${y(r['MRR@20'])}" width="26" height="${H-B-y(r['MRR@20'])}" fill="${vi?colors[mi]:'#b3bec9'}"/>`});out+=`<text x="${xx+26}" y="${H-B+25}" text-anchor="middle" font-size="14">${m}</text>`});out+=`<text x="${gx+145}" y="${H-13}" text-anchor="middle">${g}</text>`})}return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+kind+'">'+out+'</svg>'}
